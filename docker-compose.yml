name: mijia

services:
  # 通用米家 exporter：一台容器接多台设备（本地 miIO / 云端 混合）
  exporter:
    build:
      context: ./exporter
    # 默认用本地构建的镜像。想直接用已发布的镜像（不本地构建）：
    #   在 .env 里写 MIJIA_IMAGE=effectwei/mijia-exporter:1.0.3
    #   然后 docker compose pull && docker compose up -d --no-build
    image: ${MIJIA_IMAGE:-mijia-exporter:1.0.3}
    container_name: mijia-exporter
    restart: unless-stopped
    # 以宿主 uid 运行：挂载进来的 config.yaml / spec-cache 不会有属主与权限问题
    # （make init 会把当前用户的 uid/gid 写进 .env）
    user: "${EXPORTER_UID:-1000}:${EXPORTER_GID:-1000}"
    env_file:
      - .env
    volumes:
      - ./exporter/config.yaml:/app/config.yaml:ro
      - ./exporter/spec-cache:/app/spec-cache        # 规格缓存（挂在宿主上，容器重建后保留）
      # 米家登录态目录（make token 把 auth/mijia-auth.json 放这里）。
      # 挂目录而不是挂单个文件：文件不存在时 docker 会把挂载点建成目录。
      # 必须可写 —— mijiaAPI 会刷新 serviceToken 并回写它。没有云端设备时目录为空也无妨。
      - ./auth:/app/auth
    ports:
      # exporter 没有任何鉴权，暴露到局域网没必要（Prometheus 走容器内网抓它）。
      # 只绑本机，需要调试时 SSH 到本机 curl，或者临时改成 `${EXPORTER_PORT:-9101}:9101`。
      # 端口都可用 .env 覆盖 —— 例如同一网段已有别的服务占了 3000，就把 GRAFANA_PORT 改掉。
      - "127.0.0.1:${EXPORTER_PORT:-9101}:9101"
    logging:
      # Docker 默认的 json-file 驱动没有上限：长期跑会把磁盘写满。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              urllib.request.urlopen('http://127.0.0.1:9101/ready', timeout=5)
              sys.exit(0)
          except Exception:
              sys.exit(1)
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: mijia-prometheus
    restart: unless-stopped
    depends_on:
      - exporter
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      # Prometheus 自身没有鉴权。局域网自用可以这样暴露；如果这台机器有公网地址，
      # 改成 `127.0.0.1:9090:9090` 并走 SSH 隧道 / 反向代理加认证。
      - "${PROMETHEUS_PORT:-9090}:9090"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.0.10
    container_name: mijia-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mijia.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Grafana 有登录，但默认密码是 change-me —— 上生产前务必在 .env 里改掉。
      - "${GRAFANA_PORT:-3000}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus-data:
  grafana-data:
